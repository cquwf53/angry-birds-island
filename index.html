<script>
/* src/levels.js */
/* Island Adventure, expanded edition. 24 authored layouts, four six-level worlds.
   Body and mechanism coordinates are centres in a 1600 × 800 world. Ground = 660.
   Pillars meet decks exactly; no randomized structures or external assets. */
(() => {
  'use strict';
  const worlds = [
    { id:'meadow', name:'偷蛋风波', subtitle:'草坡、木屋，还有一群不肯认错的绿猪。', english:'GREENWOOD GROVE', accent:'#83b95b' },
    { id:'sunset', name:'落日追击', subtitle:'沿着海岸追上去，让回旋与连锁爆炸说话。', english:'SUNSET COAST', accent:'#e9945e' },
    { id:'moon', name:'月光密谋', subtitle:'乘上夜风，拆穿钟楼里的秘密。', english:'MOONLIT HEIGHTS', accent:'#8894ce' },
    { id:'snow', name:'冰冠决战', subtitle:'踏过冰雪与弹簧，夺回最后一枚鸟蛋。', english:'FROST CROWN', accent:'#83bdce' }
  ];
  const levels=[];
  const begin=(world,name,subtitle,birds,threeStarScore,egg,wind=0)=>({
    world,theme:worlds[world].id,name,subtitle,birds,threeStarScore,
    blocks:[],pigs:[],platforms:[],mechanisms:[],wind,...(egg?{egg:{x:egg[0],y:egg[1]}}:{})
  });
  const block=(l,x,y,w,h,material='wood',angle=0)=>l.blocks.push({x,y,w,h,material,angle});
  const column=(l,x,bottom,height,material='wood',pieces=1,width=24)=>{
    const unit=height/pieces;
    for(let i=0;i<pieces;i++)block(l,x,bottom-unit*(i+.5),width,unit,
      Array.isArray(material)?material[i%material.length]:material);
  };
  const pig=(l,x,bottom,r=24,extra={})=>l.pigs.push({x,y:bottom-r,r,...extra});
  const frame=(l,x,bottom,width,height,posts='wood',roof='wood',pieces=2,postWidth=24)=>{
    column(l,x-width/2+postWidth/2,bottom,height,posts,pieces,postWidth);
    column(l,x+width/2-postWidth/2,bottom,height,posts,pieces,postWidth);
    block(l,x,bottom-height-12,width,24,roof);
    return bottom-height-24;
  };
  const tnt=(l,x,bottom=660,size=42)=>block(l,x,bottom-size/2,size,size,'tnt');
  const platform=(l,x,top,w,h=28)=>l.platforms.push({x,y:top+h/2,w,h});

    const achievements=[[Object.values(save.levels).some(l=>l.stars===3),'一鸣惊人','取得一次三星'],Object.keys(save.eggs).length>=1? [true,'金蛋猎人','找到隐藏金蛋']:[false,'金蛋猎人','找到隐藏金蛋'],[(save.bestCombo||0)>=3,'连锁专家','达成三连击'],[Object.keys(save.levels).length>=LEVELS.length,'群岛英雄','完成全部关卡']];
    showModal('album',`<div class="modal-eyebrow">MEET THE FLOCK</div><h2 class="modal-title">十只小鸟，各显神通</h2><div class="bird-album">${cards}</div><div class="achievement-row">${achievements.map(a=>`<div class="achievement ${a[0]?'earned':''}"><b>${a[0]?'★':'☆'} ${a[1]}</b><span>${a[2]}</span></div>`).join('')}</div><div class="modal-actions">${btn('返回冒险','resume',true)}</div>`);
    for(const c of $('modalContent').querySelectorAll('[data-bird-portrait]'))Art.bird(c.getContext('2d'),80,87,c.dataset.birdPortrait==='terence'?51:43,c.dataset.birdPortrait,0,{});
  }
  function showChallenge(){
    const i=dailyIndex(),record=save.daily[dailyKey()];
    showModal('challenge',`<div class="modal-eyebrow">DAILY CHALLENGE · ${dailyKey()}</div><h2 class="modal-title">今天，换一种打法！</h2><div class="challenge-emblem">★</div><p class="modal-desc">今日战场：<b>${esc(LEVELS[i].name)}</b><br>限定阵容：回旋绿鸟 + 大红 + 炸弹黑<br>用三只小鸟完成挑战，刷新今日最高分。</p><div class="result-score"><small>今日最佳</small><strong>${format(record?.score||0)}</strong><span>${record?'已完成挑战，再冲一次纪录！':'每天一场新挑战，随时可以重试。'}</span></div><div class="modal-actions">${btn('接受挑战','daily',true)}${btn('返回','resume')}</div>`);
  }
  function showHelp(){
    showModal('help',`<div class="modal-eyebrow">HOW TO PLAY</div><h2 class="modal-title">拉！瞄！放！</h2><div class="help-grid"><div class="help-item"><b>① 拉开弹弓</b><p>拖住小鸟向后拉，白点预测飞行路线。拉得越远，飞得越快。松手发射！</p></div><div class="help-item"><b>② 空中绝招</b><p>点击场景、技能按钮或按 <span class="key">Space</span>。每只鸟都有独门绝招，去图鉴了解它们！</p></div><div class="help-item"><b>③ 连锁破坏</b><p>木头怕黄鸟，玻璃怕蓝鸟，石头怕炸弹。打断支柱、点燃 TNT，让倒塌帮你消灭绿猪。</p></div><div class="help-item"><b>④ 新机关与收集</b><p>弹簧能把小鸟弹向高处；传送门转移位置，引力场弯曲轨迹，传送带推动建筑。碰到金蛋获得 3,000 分，收集永久保存。</p></div><div class="help-item"><b>⑤ 高分秘诀</b><p>快速击破多只绿猪触发连击。每只剩余小鸟奖励 8,000 分。${LEVELS.length} 关、${LEVELS.length*3} 颗星与${LEVELS.length}颗金蛋等你挑战。玩法中心还有无限远征与12道试炼。</p></div><div class="help-item"><b>⑥ 键盘操作</b><p>↑↓ 角度 · ←→ 力度 · 空格 发射/技能<br>R 重开 · P/Esc 暂停 · M 声音 · F 全屏<br>C 开关冲击慢动作 · H 帮助</p></div></div><div class="modal-actions">${btn('出发！','resume',true)}${btn('小鸟图鉴','album')}${btn('玩法中心','modes')}</div>`);
  }
  function finish(won){
    if(resultRecorded)return;const trialFailed=won&&activeTrial&&!objectiveMet(activeTrial.goal);if(trialFailed)won=false;resultRecorded=true;phase=won?'won':'lost';
    const bonus=won?(level.birds.length-queueIndex)*8000:0,goalBonus=won&&level.objective&&objectiveMet(level.objective)?3000:0;score+=bonus+goalBonus;displayScore=score;
    if(won&&goalBonus&&playMode==='campaign')save.badges[levelIndex]=true;
    if(playMode==='voyage'){run.attemptStarted=false;if(won){run.score+=score;run.pendingNext=true;const old=save.voyageBest[run.difficulty]||{};save.voyageBest[run.difficulty]={score:Math.max(old.score||0,run.score),stage:Math.max(old.stage||0,run.stage)};}else run.lives--;persistRun();audio.play(won?'win':'lose');updateHUD();showVoyageResult(won);return;}
    let stars=0;if(won){stars=score>=level.threeStarScore?3:score>=level.threeStarScore*.64?2:1;if(activeTrial){const old=save.trials[activeTrial.id]||{};save.trials[activeTrial.id]={score:Math.max(old.score||0,score),stars:Math.max(old.stars||0,stars)};}else if(challengeMode){const key=challengeDate;save.daily[key]={score:Math.max(save.daily[key]?.score||0,score),stars:Math.max(save.daily[key]?.stars||0,stars)};}else{const old=save.levels[levelIndex];save.levels[levelIndex]={score:Math.max(old?.score||0,score),stars:Math.max(old?.stars||0,stars)};}}persist();
    audio.play(won?'win':'lose');updateHUD();
    if(won)for(let i=0;i<100;i++){const life=rand(2,4);particles.push({x:rand(200,1400),y:rand(50,260),vx:rand(-2,2),vy:rand(-3,2),color:['#ffcd59','#e96c55','#a5cf71','#8dd4e7'][i%4],kind:'shard',life,max:life,size:rand(4,8),angle:rand(0,6),spin:rand(-.1,.1)});}
    showModal('result',`<div class="modal-eyebrow">${activeTrial?'MASTER TRIAL':challengeMode?'DAILY CHALLENGE':won?'LEVEL CLEARED!':'LEVEL FAILED!'}</div><h2 class="modal-title">${won?(stars===3?'三星！漂亮！':'绿猪全灭！'):'再来一次！'}</h2><div class="result-stars" aria-label="${stars}颗星">${[1,2,3].map(n=>`<span class="${n<=stars?'earned':''}" style="--delay:${n*.16}s">★</span>`).join('')}</div><div class="result-score"><small>SCORE</small><strong>${format(score)}</strong><span>${won?`剩余小鸟奖励 +${format(bonus)}${eggCollected?' · 金蛋 +3,000':''}${goalBonus?' · 奖励目标 +3,000':''}`:`还剩 ${pigs.filter(p=>!meta(p).dead).length} 只绿猪`}</span></div><p class="modal-desc">${trialFailed?'绿猪已清空，但还没有完成必达任务：'+activeTrial.goal.label:won?(challengeMode?'今日成绩已保存，明天再来挑战！':stars===3?'完美的破坏艺术。下一关，继续！':'寻找薄弱点，用更少的小鸟拿下三星！'):'换个角度，或者试着从背后突破。'}</p><div class="modal-actions">${won&&activeTrial&&activeTrial.id<TRIALS.length-1?btn('下一道试炼 ▶','trial-next',true):won&&!challengeMode&&!activeTrial&&levelIndex<LEVELS.length-1?btn('下一关 ▶','next',true):btn('再来一次','restart',true)}${won&&!challengeMode&&!activeTrial?btn('再玩一次','restart'):''}${activeTrial?btn('试炼列表','trials'):btn('关卡地图','levels')}${btn('主菜单','home')}</div>`);
  }
  $('modalContent').addEventListener('click',e=>{
    const button=e.target.closest('button');if(!button)return;audio.init?.();audio.unlock?.();audio.play('click');
    if(button.dataset.worldPage!==undefined){showLevels(clamp((Math.floor(mapWorld/4)+(button.dataset.worldPage==='next'?1:-1))*4,0,WORLDS.length-1),0);return;}
    if(button.dataset.levelPage!==undefined){showLevels(mapWorld,+button.dataset.levelPage);return;}
    if(button.dataset.trial!==undefined){startTrial(+button.dataset.trial);return;}
    if(button.dataset.upgrade){chooseUpgrade(button.dataset.upgrade);return;}
    if(button.dataset.world!==undefined){showLevels(+button.dataset.world,0);return;}
    if(button.dataset.level!==undefined){loadLevel(+button.dataset.level);return;}
    const action=button.dataset.action;if(action==='resume')closeModal();else if(action==='restart')restartCurrent();else if(action==='next')loadLevel(levelIndex+1);else if(action==='levels')showLevels();else if(action==='home')openHome();else if(action==='album')showAlbum();else if(action==='modes')showModes();else if(action==='voyage-setup')showVoyageSetup();else if(action==='voyage-start')startVoyage($('voyageSeed').value,$('voyageDifficulty').value);else if(action==='voyage-resume')resumeVoyage();else if(action==='voyage-next')advanceVoyage();else if(action==='trials')showTrials();else if(action==='trial-next'&&activeTrial)startTrial(activeTrial.id+1);else if(action==='daily-menu')showChallenge();else if(action==='daily'){audio.init?.();loadLevel(dailyIndex(),{challenge:true});}
  });
  $('modalOverlay').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const buttons=[...$('modalContent').querySelectorAll('button:not([disabled]),input,select')];if(!buttons.length)return;const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}});
  function toggleSound(){save.sound=!save.sound;save.eggs=save.eggs||{};save.daily=save.daily||{};save.trials=save.trials||{};save.badges=save.badges||{};save.voyageBest=save.voyageBest||{};save.schema=3;
  audio.setEnabled(save.sound);if(save.sound){audio.init?.();audio.unlock?.();audio.play('click');}persist();updateSound();}
  function updateSound(){$('soundBtn').classList.toggle('muted',!save.sound);$('soundBtn').setAttribute('aria-label',save.sound?'关闭声音':'开启声音');$('soundBtn').setAttribute('aria-pressed',String(save.sound));$('soundBtn').title=save.sound?'关闭声音 (M)':'开启声音 (M)';}
  $('soundBtn').addEventListener('click',toggleSound);$('helpBtn').addEventListener('click',showHelp);$('levelsBtn').addEventListener('click',showLevels);$('pauseBtn').addEventListener('click',togglePause);$('restartBtn').addEventListener('click',restartCurrent);$('abilityBtn').addEventListener('click',ability);
  $('fullscreenBtn').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(_){toast('当前浏览器不支持全屏，可使用 F11',3);}});
  function updateCinema(){$('cinemaBtn')?.classList.toggle('disabled',!save.cinema);$('cinemaBtn')?.setAttribute('aria-pressed',String(save.cinema));}
  function toggleCinema(){save.cinema=!save.cinema;persist();updateCinema();toast(save.cinema?'冲击慢动作：开启':'冲击慢动作：关闭',1.5);}
  const bind=(id,fn)=>$(id)?.addEventListener('click',()=>{audio.init?.();audio.play('click');fn();});
  bind('playBtn',()=>loadLevel(clamp(save.lastLevel||0,0,LEVELS.length-1)));bind('homeLevelsBtn',showLevels);bind('homeAlbumBtn',showAlbum);bind('homeChallengeBtn',showChallenge);bind('homeBtn',openHome);bind('albumBtn',showAlbum);bind('cinemaBtn',toggleCinema);bind('homeModesBtn',showModes);
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&!modal&&phase!=='won'&&phase!=='lost'){cancelAim();togglePause();}lastTime=performance.now();accumulator=0;});
  window.addEventListener('blur',cancelAim);
  function frame(time){
    const delta=Math.min((time-lastTime)/1000||0,.05);lastTime=time;ambientTime+=delta;
    slowMo=Math.max(0,slowMo-delta);
    if(homeOpen)drawHomeFlock();
    if(!paused){accumulator+=delta*1000*(slowMo>0&&save.cinema ? .4 : 1);let loops=0;while(accumulator>=STEP&&loops++<4){update(STEP/1000);accumulator-=STEP;}}
    else if(modal==='result'&&phase==='won'){for(const p of particles){p.life-=delta;p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.angle+=p.spin;}particles=particles.filter(p=>p.life>0);}
    draw();requestAnimationFrame(frame);
  }
  // Read-only diagnostic state supports repeatable browser QA without changing play.
  window.IslandGame={getState:()=>({version:'3.0.0',totalLevels:LEVELS.length,worldCount:WORLDS.length,birdCount:Object.keys(BIRDS).length,level:levelIndex,phase,paused,homeOpen,playMode,challengeMode,challengeDate,eggCollected,metrics:{...metrics,skills:[...(metrics.skills||[])]},trial:activeTrial?.id??null,voyage:playMode==='voyage'?{seed:run.seed,stage:run.stage,lives:run.lives,score:run.score,difficulty:run.difficulty,upgrades:{...run.upgrades}}:null,world:level.world||0,modal,score,birdsRemaining:level.birds.length-queueIndex,pigsAlive:pigs.filter(p=>!meta(p).dead).length,shotCount,skillUsed,active:activeBird?{x:activeBird.position.x,y:activeBird.position.y,type:meta(activeBird).type,used:meta(activeBird).used,vx:activeBird.velocity.x,vy:activeBird.velocity.y,r:meta(activeBird).r}:null,bodyCount:Composite.allBodies(engine.world).length,stars:save.levels[levelIndex]?.stars||0,totalEggs:Object.keys(save.eggs).length,mechanisms:mechanisms.map(o=>({type:o.type,pulse:o.pulse})),slowMo})};
  resize();const resumeIndex=save.lastLevel||0;loadLevel(5);save.lastLevel=resumeIndex;updateSound();updateCinema();openHome();requestAnimationFrame(frame);
})();

</script>
</body>
</html>
