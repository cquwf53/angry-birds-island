<script>
/* src/levels.js */
/* Island Adventure, expanded edition. 24 authored layouts, four six-level worlds.
   Body and mechanism coordinates are centres in a 1600 × 800 world. Ground = 660.
   Pillars meet decks exactly; no randomized structures or external assets. */
(() => {
  'use strict';
  const worlds = [
    { id:'meadow', name:'偷蛋风波', subtitle:'草坡、木屋，还有一群不肯认错的绿猪。', english:'GREENWOOD GROVE', accent:'#83b95b' },
    { id:'sunset', name:'落日追击', subtitle:'沿着海岸追上去，让回旋与连锁爆炸说话。', english:'SUNSET COAST', accent:'#e9945e' },
    { id:'moon', name:'月光密谋', subtitle:'乘上夜风，拆穿钟楼里的秘密。', english:'MOONLIT HEIGHTS', accent:'#8894ce' },
    { id:'snow', name:'冰冠决战', subtitle:'踏过冰雪与弹簧，夺回最后一枚鸟蛋。', english:'FROST CROWN', accent:'#83bdce' }
  ];
  const levels=[];
  const begin=(world,name,subtitle,birds,threeStarScore,egg,wind=0)=>({
    world,theme:worlds[world].id,name,subtitle,birds,threeStarScore,
    blocks:[],pigs:[],platforms:[],mechanisms:[],wind,...(egg?{egg:{x:egg[0],y:egg[1]}}:{})
  });
  const block=(l,x,y,w,h,material='wood',angle=0)=>l.blocks.push({x,y,w,h,material,angle});
  const column=(l,x,bottom,height,material='wood',pieces=1,width=24)=>{
    const unit=height/pieces;
    for(let i=0;i<pieces;i++)block(l,x,bottom-unit*(i+.5),width,unit,
      Array.isArray(material)?material[i%material.length]:material);
  };
  const pig=(l,x,bottom,r=24,extra={})=>l.pigs.push({x,y:bottom-r,r,...extra});
  const frame=(l,x,bottom,width,height,posts='wood',roof='wood',pieces=2,postWidth=24)=>{
    column(l,x-width/2+postWidth/2,bottom,height,posts,pieces,postWidth);
    column(l,x+width/2-postWidth/2,bottom,height,posts,pieces,postWidth);
    block(l,x,bottom-height-12,width,24,roof);
    return bottom-height-24;
  };
  const tnt=(l,x,bottom=660,size=42)=>block(l,x,bottom-size/2,size,size,'tnt');
  const platform=(l,x,top,w,h=28)=>l.platforms.push({x,y:top+h/2,w,h});
  const fan=(l,x,y,w=108,h=188,strength=.32)=>l.mechanisms.push({type:'fan',x,y,w,h,strength});
  const spring=(l,x,y=652,w=90)=>l.mechanisms.push({type:'spring',x,y,w,h:16});
  const finish=l=>{l.id=`${l.world+1}-${levels.filter(v=>v.world===l.world).length+1}`;levels.push(l);};
  let l,top,upper;

  // WORLD 1 — each bird gets a clear role before the first royal fortress.
  l=begin(0,'木屋里的坏主意','打掉承重木柱，让两层屋顶一起落下来。',['red','yellow','blue','red'],31000,[675,405]);
  top=frame(l,1070,660,264,110,'wood','wood');
  frame(l,1070,top,184,90,['glass','wood'],'wood');
  pig(l,1025,660);pig(l,1125,660);pig(l,1070,top);
  finish(l);

  l=begin(0,'木匠的午后','黄鸟加速穿过木柱，留意高处的那一只。',['yellow','red','yellow','red'],33000,[760,360]);
  top=frame(l,1000,660,156,112,'wood','wood');pig(l,1000,660);pig(l,1000,top);
  frame(l,1275,660,164,168,'wood','wood',3);pig(l,1275,660);
  block(l,1138,636,44,48,'wood');
  finish(l);

  l=begin(0,'玻璃花房','蓝鸟分成三只，薄薄的玻璃可挡不住它们。',['blue','red','yellow','blue'],35500,[870,315]);
  for(const x of [980,1230]){
    top=frame(l,x,660,166,116,['glass','wood'],'glass',2,22);
    pig(l,x,660);pig(l,x,top,23);
  }
  finish(l);

  l=begin(0,'一声巨响','黑鸟落地后会爆炸，也可以在空中主动引爆。',['bomb','yellow','red','blue'],39500,[715,435]);
  for(const x of [1010,1270]){
    top=frame(l,x,660,154,132,['wood','stone'],'stone',2,24);
    pig(l,x,660,24,{helmet:true});pig(l,x+(x===1010?20:-20),top-24,23);
  }
  tnt(l,1140);block(l,1140,492,258,24,'wood');
  finish(l);

  l=begin(0,'白云投递员','飞过屋顶再投蛋，白鸟会借力向上飞走。',['white','blue','yellow','red'],44000,[940,270]);
  top=frame(l,1120,660,284,112,'wood','wood');
  pig(l,1050,660);pig(l,1190,660);
  upper=frame(l,1120,top,204,110,['glass','wood'],'glass');
  pig(l,1080,top);pig(l,1160,top);pig(l,1120,upper,23);
  finish(l);

<script>
/* src/game.js */
/* Island Adventure — deterministic physics, procedural effects, offline UI. */
(() => {
  'use strict';

  let engine,levelIndex=0,level,blocks=[],pigs=[],birds=[],platforms=[],particles=[],labels=[],rings=[],trail=[],lastTrail=[];
  let queueIndex=0,activeBird=null,drag=null,pointerId=null,phase='ready',score=0,displayScore=0;

  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function resize(){
    const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);

  new ResizeObserver(resize).observe(canvas);

    activeBird=null;drag=null;closeModal();spawnReady();
    $('chapterLabel').textContent=challengeMode?'DAILY CHALLENGE':(window.WORLDS?.[level.world||0]?.name||'怒鸟群岛');

  }

    }
    const power=clamp(Math.hypot(SLING.x-p.x,SLING.y-p.y)/110,0,1);
    ctx.globalAlpha=.8;ctx.strokeStyle='rgba(47,65,38,.22)';ctx.lineWidth=6;ctx.beginPath();ctx.arc(SLING.x,SLING.y,55,.2,Math.PI-.2);ctx.stroke();ctx.strokeStyle=power>.85?'#ffcf59':'#fffce2';ctx.beginPath();ctx.arc(SLING.x,SLING.y,55,.2,.2+(Math.PI-.4)*power);ctx.stroke();ctx.restore();
  }
  function drawParticles(){
    for(const p of particles){ctx.save();ctx.globalAlpha=Math.min(1,p.life/p.max*2);ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.color;
      if(p.kind==='dust'){ctx.globalAlpha*=.26;ctx.beginPath();ctx.arc(0,0,p.size*(1.5-p.life/p.max*.5),0,Math.PI*2);ctx.fill();}
      else if(p.kind==='spark'){ctx.beginPath();ctx.moveTo(-p.size,0);ctx.lineTo(0,-p.size*.3);ctx.lineTo(p.size,0);ctx.lineTo(0,p.size*.3);ctx.fill();}
      else if(p.kind==='feather'){ctx.beginPath();ctx.ellipse(0,0,p.size,p.size*.35,0,0,Math.PI*2);ctx.fill();}
      else {ctx.beginPath();ctx.moveTo(-p.size,-p.size*.4);ctx.lineTo(p.size*.6,-p.size*.5);ctx.lineTo(p.size,p.size*.25);ctx.lineTo(-p.size*.6,p.size*.6);ctx.fill();if(p.kind==='glass'){ctx.strokeStyle='#edffff';ctx.lineWidth=1;ctx.stroke();}}
      ctx.restore();
    }
  }
  function screenPoint(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
  function clampDrag(p){let dx=p.x-SLING.x,dy=p.y-SLING.y;const d=Math.hypot(dx,dy);if(d>110){dx*=110/d;dy*=110/d;}return{x:SLING.x+dx,y:SLING.y+dy};}
  canvas.addEventListener('pointerdown',e=>{
    if(e.button!==0||paused||modal)return;audio.init?.();audio.unlock?.();canvas.focus({preventScroll:true});pointerWorld=screenPoint(e);
    if(phase==='flying'){ability();return;}
    if(phase==='ready'&&Math.hypot(pointerWorld.x-SLING.x,pointerWorld.y-SLING.y)<95){e.preventDefault();pointerId=e.pointerId;canvas.setPointerCapture(e.pointerId);drag=clampDrag(pointerWorld);phase='aiming';audio.play('pull');$('shotHint').classList.add('hidden');canvas.classList.add('dragging');}
  });
  canvas.addEventListener('pointermove',e=>{pointerWorld=screenPoint(e);if(pointerId===e.pointerId&&drag){drag=clampDrag(pointerWorld);e.preventDefault();}canvas.style.cursor=phase==='ready'&&Math.hypot(pointerWorld.x-SLING.x,pointerWorld.y-SLING.y)<95?'grab':phase==='aiming'?'grabbing':phase==='flying'?'crosshair':'default';});
  canvas.addEventListener('pointerup',e=>{if(e.pointerId===pointerId&&drag){const p=drag;pointerId=null;canvas.classList.remove('dragging');if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);launch(p);}});
  const cancelAim=()=>{if(phase==='aiming'){drag=null;phase='ready';pointerId=null;canvas.classList.remove('dragging');}};
  canvas.addEventListener('pointercancel',cancelAim);
  canvas.addEventListener('lostpointercapture',()=>{if(pointerId!==null)cancelAim();});
  window.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    if((e.key===' '||e.key==='Enter')&&e.target.closest('button'))return;
    if(e.key==='Escape'){e.preventDefault();if(modal)closeModal();else togglePause();return;}
    if(e.key.toLowerCase()==='r'&&!modal){e.preventDefault();loadLevel(levelIndex,{challenge:challengeMode,challengeKey:challengeDate});return;}
    if(e.key.toLowerCase()==='m'){toggleSound();return;}
    if(e.key.toLowerCase()==='c'){toggleCinema();return;}
    if(e.key.toLowerCase()==='h'){showHelp();return;}
    if(e.key.toLowerCase()==='f'){$('fullscreenBtn').click();return;}
    if(e.key.toLowerCase()==='p'){e.preventDefault();togglePause();return;}
    if(paused||modal)return;
    if(e.key===' '){e.preventDefault();if(phase==='flying')ability();else if(phase==='ready'||phase==='aiming'){const p=drag||{x:SLING.x-Math.cos(aimAngle)*aimPower*110,y:SLING.y-Math.sin(aimAngle)*aimPower*110};launch(p);}return;}
    if(e.key.startsWith('Arrow')&&(phase==='ready'||phase==='aiming')){
      e.preventDefault();if(e.key==='ArrowUp')aimAngle=clamp(aimAngle-.04,-1.4,.2);if(e.key==='ArrowDown')aimAngle=clamp(aimAngle+.04,-1.4,.2);if(e.key==='ArrowRight')aimPower=clamp(aimPower+.04,.2,1);if(e.key==='ArrowLeft')aimPower=clamp(aimPower-.04,.2,1);
      drag={x:SLING.x-Math.cos(aimAngle)*aimPower*110,y:SLING.y-Math.sin(aimAngle)*aimPower*110};phase='aiming';
    }
  });
  function closeModal(){
    if(homeOpen){openHome();return;}
    if((phase==='won'||phase==='lost')&&resultHTML){showModal('result',resultHTML);return;}
    $('modalOverlay').classList.add('hidden');modal=null;paused=false;$('pauseBtn').classList.remove('is-paused');updateHUD();canvas.focus({preventScroll:true});
  }
  function showModal(kind,html){if(kind==='result')resultHTML=html;cancelAim();modal=kind;paused=true;$('modalOverlay').dataset.kind=kind;$('modalContent').innerHTML=html;$('modalOverlay').classList.remove('hidden');$('abilityBtn').classList.add('hidden');$('modalContent').querySelector('button')?.focus({preventScroll:true});}
  const btn=(text,action,primary=false)=>`<button type="button" class="${primary?'primary-btn':'secondary-btn'}" data-action="${action}">${text}</button>`;
  function togglePause(){
    if(modal==='pause'){closeModal();return;}if(modal)return;
    showModal('pause',`<div class="modal-eyebrow">PAUSED</div><h2 class="modal-title">稍作休息！</h2><p class="modal-desc">准备好了，就继续发射。</p><div class="modal-actions">${btn('继续 ▶','resume',true)}${btn('重新挑战','restart')}${btn('关卡地图','levels')}${btn('主菜单','home')}</div><p class="modal-footnote">按 P 或 Esc 继续</p>`);
    $('pauseBtn').classList.add('is-paused');
  }
  function worldInfo(index){return window.WORLDS?.[index]||{name:['偷蛋风波','落日峡谷','月夜奇袭','冰雪王国'][index],subtitle:'准备好，让绿猪飞起来！',id:['meadow','sunset','moon','snow'][index]};}
  function totalStars(){return Object.values(save.levels).reduce((n,l)=>n+(l.stars||0),0);}
  function dailyKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function dailyIndex(key=dailyKey()){return [...key].reduce((n,c)=>(n*31+c.charCodeAt(0))%997,17)%LEVELS.length;}
  function openHome(){
    if(!homeOpen&&(levelIndex!==5||canDamage)){const resume=save.lastLevel;loadLevel(5);save.lastLevel=resume;}
    cancelAim();homeOpen=true;paused=true;modal='home';toastTimer=0;$('toast').classList.add('hidden');$('modalOverlay').classList.add('hidden');$('homeScreen')?.classList.remove('hidden');$('abilityBtn').classList.add('hidden');
    if($('homeStars'))$('homeStars').textContent=`${totalStars()} / ${LEVELS.length*3}`;
    if($('homeEggs'))$('homeEggs').textContent=`${Object.keys(save.eggs).length} / ${LEVELS.filter(l=>l.egg).length}`;
    drawHomeFlock();$('playBtn')?.focus({preventScroll:true});
  }
  function drawHomeFlock(){
    const c=$('titleBirds');if(!c)return;
    if(c.width!==1200){c.width=1200;c.height=410;}
    const g=c.getContext('2d');g.clearRect(0,0,1200,410);
    const flock=[['terence',175,291,93],['white',750,280,77],['bomb',590,268,87],['boomerang',912,310,71],['yellow',438,299,76],['red',298,275,95],['blue',1050,325,48]];
    for(const [type,x,y,r] of flock){g.fillStyle='rgba(15,39,16,.22)';g.beginPath();g.ellipse(x,366,r*.75,12,0,0,Math.PI*2);g.fill();Art.bird(g,x,y+Math.sin(ambientTime*1.7+x)*3,r,type,Math.sin(ambientTime*.7+x)*.018,{blink:Math.sin(ambientTime+x)>.997});}
  }
  function showLevels(world){
    mapWorld=typeof world==='number'?clamp(world,0,3):(level.world||0);
    const info=worldInfo(mapWorld),points=[[10,66],[25,31],[42,62],[59,27],[76,60],[91,28]];
    const tabs=[0,1,2,3].map(i=>`<button type="button" class="world-tab ${i===mapWorld?'active':''}" data-world="${i}"><span>${['☀','☄','☾','❄'][i]}</span>${esc(worldInfo(i).name)}</button>`).join('');
    let nodes='';LEVELS.forEach((l,i)=>{if((l.world||0)!==mapWorld)return;const n=i%6,p=points[n],record=save.levels[i],stars=record?.stars||0;
      nodes+=`<button type="button" class="map-node ${stars?'completed':''} ${i===levelIndex?'current':''} ${n===5?'boss-node':''}" style="--x:${p[0]}%;--y:${p[1]}%" data-level="${i}" aria-label="第${i+1}关 ${esc(l.name)}，${stars}星"><span class="node-number">${n===5?'♛':n+1}</span><span class="node-stars">${[1,2,3].map(j=>`<i class="${j<=stars?'earned':''}">★</i>`).join('')}</span><span class="node-name">${esc(l.name)}</span>${save.eggs[i]?'<span class="node-egg" title="已找到金蛋">◆</span>':''}</button>`;
    });
    showModal('levels',`<div class="map-top"><div><div class="modal-eyebrow">EPISODE ${mapWorld+1}</div><h2 class="modal-title">怒鸟冒险地图</h2></div><div class="map-totals">★ ${totalStars()} / ${LEVELS.length*3}<span>金蛋 ${Object.keys(save.eggs).length}</span></div></div><div class="world-tabs">${tabs}</div><div class="map-board theme-${info.id||info.theme||['meadow','sunset','moon','snow'][mapWorld]}"><div class="world-heading"><strong>${esc(info.name)}</strong><span>${esc(info.subtitle||'选择关卡，向绿猪发起挑战！')}</span></div><svg class="map-path" viewBox="0 0 1000 430" preserveAspectRatio="none" aria-hidden="true"><path d="M100 284 C140 294 177 87 250 133 S340 280 420 267 S510 80 590 116 S695 280 760 258 S850 117 910 120"/></svg>${nodes}<div class="map-grass"></div></div><div class="map-nav"><span>每一关都有一颗隐藏金蛋 · 自由选择挑战</span>${btn(homeOpen?'返回主菜单':'返回游戏','resume')}</div>`);
  }
  function showAlbum(){
    const details={red:['怒鸟红','RED','稳定的抛物线与近距离冲击波，最适合攻击承重支柱。接近建筑时再使用技能。'],yellow:['飞镖黄','CHUCK','飞行中瞬间加速。木头是它的拿手好戏，先瞄准结构薄弱处再冲刺。'],blue:['蓝弟弟','THE BLUES','一分为三，扩大打击范围。三只蓝鸟对玻璃能造成更高伤害。'],bomb:['炸弹黑','BOMB','主动引爆，或猛烈撞击后延时引爆。冲击波能掀翻石墙、点燃 TNT。'],white:['白公主','MATILDA','投下一枚会爆炸的蛋，同时向上弹射。适合从上方打击受掩护的绿猪。'],boomerang:['回旋绿鸟','HAL','飞到目标背后再释放技能，像回旋镖一样反向突袭。位置比力度更重要。'],terence:['大红','TERENCE','体型与重量远超其他小鸟。空中释放陨石重坠，落点会产生强烈震荡。']};
    const cards=Object.entries(details).map(([type,d])=>`<article class="bird-card type-${type}"><canvas class="portrait" data-bird-portrait="${type}" width="160" height="150" aria-label="${d[0]}"></canvas><div class="bird-detail"><small>${d[1]}</small><h3>${d[0]}</h3><p>${d[2]}</p></div></article>`).join('');
    const achievements=[[Object.values(save.levels).some(l=>l.stars===3),'一鸣惊人','取得一次三星'],Object.keys(save.eggs).length>=1? [true,'金蛋猎人','找到隐藏金蛋']:[false,'金蛋猎人','找到隐藏金蛋'],[(save.bestCombo||0)>=3,'连锁专家','达成三连击'],[Object.keys(save.levels).length>=24,'群岛英雄','完成全部关卡']];
    showModal('album',`<div class="modal-eyebrow">MEET THE FLOCK</div><h2 class="modal-title">七只小鸟，各显神通</h2><div class="bird-album">${cards}</div><div class="achievement-row">${achievements.map(a=>`<div class="achievement ${a[0]?'earned':''}"><b>${a[0]?'★':'☆'} ${a[1]}</b><span>${a[2]}</span></div>`).join('')}</div><div class="modal-actions">${btn('返回冒险','resume',true)}</div>`);
    for(const c of $('modalContent').querySelectorAll('[data-bird-portrait]'))Art.bird(c.getContext('2d'),80,87,c.dataset.birdPortrait==='terence'?51:43,c.dataset.birdPortrait,0,{});
  }
  function showChallenge(){
    const i=dailyIndex(),record=save.daily[dailyKey()];
    showModal('challenge',`<div class="modal-eyebrow">DAILY CHALLENGE · ${dailyKey()}</div><h2 class="modal-title">今天，换一种打法！</h2><div class="challenge-emblem">★</div><p class="modal-desc">今日战场：<b>${esc(LEVELS[i].name)}</b><br>限定阵容：回旋绿鸟 + 大红 + 炸弹黑<br>用三只小鸟完成挑战，刷新今日最高分。</p><div class="result-score"><small>今日最佳</small><strong>${format(record?.score||0)}</strong><span>${record?'已完成挑战，再冲一次纪录！':'每天一场新挑战，随时可以重试。'}</span></div><div class="modal-actions">${btn('接受挑战','daily',true)}${btn('返回','resume')}</div>`);
  }
  function showHelp(){
    showModal('help',`<div class="modal-eyebrow">HOW TO PLAY</div><h2 class="modal-title">拉！瞄！放！</h2><div class="help-grid"><div class="help-item"><b>① 拉开弹弓</b><p>拖住小鸟向后拉，白点预测飞行路线。拉得越远，飞得越快。松手发射！</p></div><div class="help-item"><b>② 空中绝招</b><p>点击场景、技能按钮或按 <span class="key">Space</span>。每只鸟都有独门绝招，去图鉴了解它们！</p></div><div class="help-item"><b>③ 连锁破坏</b><p>木头怕黄鸟，玻璃怕蓝鸟，石头怕炸弹。打断支柱、点燃 TNT，让倒塌帮你消灭绿猪。</p></div><div class="help-item"><b>④ 新机关与收集</b><p>弹簧能把小鸟弹向高处；气流会托起小鸟，风向也会影响轨迹。碰到金蛋获得 3,000 分，收集永久保存。</p></div><div class="help-item"><b>⑤ 高分秘诀</b><p>快速击破多只绿猪触发连击。每只剩余小鸟奖励 8,000 分。24 关、72 颗星与24颗金蛋等你挑战。</p></div><div class="help-item"><b>⑥ 键盘操作</b><p>↑↓ 角度 · ←→ 力度 · 空格 发射/技能<br>R 重开 · P/Esc 暂停 · M 声音 · F 全屏<br>C 开关冲击慢动作 · H 帮助</p></div></div><div class="modal-actions">${btn('出发！','resume',true)}${btn('小鸟图鉴','album')}</div>`);
  }
  function finish(won){
    if(resultRecorded)return;resultRecorded=true;phase=won?'won':'lost';
    const bonus=won?(level.birds.length-queueIndex)*8000:0;score+=bonus;displayScore=score;
    let stars=0;if(won){stars=score>=level.threeStarScore?3:score>=level.threeStarScore*.64?2:1;if(challengeMode){const key=challengeDate;save.daily[key]={score:Math.max(save.daily[key]?.score||0,score),stars:Math.max(save.daily[key]?.stars||0,stars)};}else{const old=save.levels[levelIndex];save.levels[levelIndex]={score:Math.max(old?.score||0,score),stars:Math.max(old?.stars||0,stars)};}}persist();
    audio.play(won?'win':'lose');updateHUD();
    if(won)for(let i=0;i<100;i++){const life=rand(2,4);particles.push({x:rand(200,1400),y:rand(50,260),vx:rand(-2,2),vy:rand(-3,2),color:['#ffcd59','#e96c55','#a5cf71','#8dd4e7'][i%4],kind:'shard',life,max:life,size:rand(4,8),angle:rand(0,6),spin:rand(-.1,.1)});}
    showModal('result',`<div class="modal-eyebrow">${challengeMode?'DAILY CHALLENGE':won?'LEVEL CLEARED!':'LEVEL FAILED!'}</div><h2 class="modal-title">${won?(stars===3?'三星！漂亮！':'绿猪全灭！'):'再来一次！'}</h2><div class="result-stars" aria-label="${stars}颗星">${[1,2,3].map(n=>`<span class="${n<=stars?'earned':''}" style="--delay:${n*.16}s">★</span>`).join('')}</div><div class="result-score"><small>SCORE</small><strong>${format(score)}</strong><span>${won?`剩余小鸟奖励 +${format(bonus)}${eggCollected?' · 金蛋 +3,000':''}`:`还剩 ${pigs.filter(p=>!meta(p).dead).length} 只绿猪`}</span></div><p class="modal-desc">${won?(challengeMode?'今日成绩已保存，明天再来挑战！':stars===3?'完美的破坏艺术。下一关，继续！':'寻找薄弱点，用更少的小鸟拿下三星！'):'换个角度，或者试着从背后突破。'}</p><div class="modal-actions">${won&&!challengeMode&&levelIndex<LEVELS.length-1?btn('下一关 ▶','next',true):btn('再来一次','restart',true)}${won&&!challengeMode?btn('再玩一次','restart'):''}${btn('关卡地图','levels')}${btn('主菜单','home')}</div>`);
  }
  $('modalContent').addEventListener('click',e=>{
    const button=e.target.closest('button');if(!button)return;audio.init?.();audio.unlock?.();audio.play('click');
    if(button.dataset.world!==undefined){showLevels(+button.dataset.world);return;}
    if(button.dataset.level!==undefined){loadLevel(+button.dataset.level);return;}
    const action=button.dataset.action;if(action==='resume')closeModal();else if(action==='restart')loadLevel(levelIndex,{challenge:challengeMode,challengeKey:challengeDate});else if(action==='next')loadLevel(levelIndex+1);else if(action==='levels')showLevels();else if(action==='home')openHome();else if(action==='album')showAlbum();else if(action==='daily'){audio.init?.();loadLevel(dailyIndex(),{challenge:true});}
  });
  $('modalOverlay').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const buttons=[...$('modalContent').querySelectorAll('button')];if(!buttons.length)return;const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}});
  function toggleSound(){save.sound=!save.sound;save.eggs=save.eggs||{};save.daily=save.daily||{};
  audio.setEnabled(save.sound);if(save.sound){audio.init?.();audio.unlock?.();audio.play('click');}persist();updateSound();}
  function updateSound(){$('soundBtn').classList.toggle('muted',!save.sound);$('soundBtn').setAttribute('aria-label',save.sound?'关闭声音':'开启声音');$('soundBtn').setAttribute('aria-pressed',String(save.sound));$('soundBtn').title=save.sound?'关闭声音 (M)':'开启声音 (M)';}
  $('soundBtn').addEventListener('click',toggleSound);$('helpBtn').addEventListener('click',showHelp);$('levelsBtn').addEventListener('click',showLevels);$('pauseBtn').addEventListener('click',togglePause);$('restartBtn').addEventListener('click',()=>loadLevel(levelIndex,{challenge:challengeMode,challengeKey:challengeDate}));$('abilityBtn').addEventListener('click',ability);
  $('fullscreenBtn').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(_){toast('当前浏览器不支持全屏，可使用 F11',3);}});
  function updateCinema(){$('cinemaBtn')?.classList.toggle('disabled',!save.cinema);$('cinemaBtn')?.setAttribute('aria-pressed',String(save.cinema));}
  function toggleCinema(){save.cinema=!save.cinema;persist();updateCinema();toast(save.cinema?'冲击慢动作：开启':'冲击慢动作：关闭',1.5);}
  const bind=(id,fn)=>$(id)?.addEventListener('click',()=>{audio.init?.();audio.play('click');fn();});
  bind('playBtn',()=>loadLevel(clamp(save.lastLevel||0,0,LEVELS.length-1)));bind('homeLevelsBtn',showLevels);bind('homeAlbumBtn',showAlbum);bind('homeChallengeBtn',showChallenge);bind('homeBtn',openHome);bind('albumBtn',showAlbum);bind('cinemaBtn',toggleCinema);
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&!modal&&phase!=='won'&&phase!=='lost'){cancelAim();togglePause();}lastTime=performance.now();accumulator=0;});
  window.addEventListener('blur',cancelAim);
  function frame(time){
    const delta=Math.min((time-lastTime)/1000||0,.05);lastTime=time;ambientTime+=delta;
    slowMo=Math.max(0,slowMo-delta);
    if(homeOpen)drawHomeFlock();
    if(!paused){accumulator+=delta*1000*(slowMo>0&&save.cinema ? .4 : 1);let loops=0;while(accumulator>=STEP&&loops++<4){update(STEP/1000);accumulator-=STEP;}}
    else if(modal==='result'&&phase==='won'){for(const p of particles){p.life-=delta;p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.angle+=p.spin;}particles=particles.filter(p=>p.life>0);}
    draw();requestAnimationFrame(frame);
  }
  // Read-only diagnostic state supports repeatable browser QA without changing play.
  window.IslandGame={getState:()=>({level:levelIndex,phase,paused,homeOpen,challengeMode,challengeDate,eggCollected,world:level.world||0,modal,score,birdsRemaining:level.birds.length-queueIndex,pigsAlive:pigs.filter(p=>!meta(p).dead).length,shotCount,skillUsed,active:activeBird?{x:activeBird.position.x,y:activeBird.position.y,type:meta(activeBird).type,used:meta(activeBird).used}:null,bodyCount:Composite.allBodies(engine.world).length,stars:save.levels[levelIndex]?.stars||0,totalEggs:Object.keys(save.eggs).length,mechanisms:mechanisms.map(o=>({type:o.type,pulse:o.pulse})),slowMo})};
  resize();const resumeIndex=save.lastLevel||0;loadLevel(5);save.lastLevel=resumeIndex;updateSound();updateCinema();openHome();requestAnimationFrame(frame);
})();

</script>
